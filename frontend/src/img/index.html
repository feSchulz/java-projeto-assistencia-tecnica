    <style>
        /*tema escuro*/
        body {
            font-family: sans-serif;
            background: #0F1115;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #FFFFFF;
        }

        .login-container {
            width: 350px;
            padding: 30px;
            background: #1A1F26;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-container img {
            width: 250px;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #00AEEF; /* azul claro da logo */
        }

        .login-form input {
            width: 326px;
            padding: 10px;
            margin: 8px 0;
            background: #0F1115;
            border: 1px solid #2C3440;
            border-radius: 4px;
            color: #FFFFFF;
        }

        .login-form input::placeholder {
            color: #C7CCD4;
        }

        .login-form button {
            width: 100%;
            padding: 12px;
            background: #005F8F;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-form button:hover {
            background: #0072A8;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #C7CCD4;
        }
    </style>
</head>
<body>
<div class="login-container">
    <img src="logos-icon.png" alt="Logos ERP" />
    <h2>Bem-vindo ao Logos</h2>
    <form class="login-form">
        <input type="text" placeholder="Usuário ou E-mail" />
        <input type="password" placeholder="Senha" />
        <button type="submit">Entrar</button>
    </form>
    <footer>
        <small>© 2025 Logos - Assistência Técnica</small>
    </footer>
</div>
</body>
</html>
